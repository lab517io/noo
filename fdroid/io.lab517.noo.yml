    scandelete:
      - client/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export NOO_UNSIGNED_RELEASE=1
      - $$flutter$$/bin/flutter build apk --release
    ndk: 28.2.13676358

